# 15 synthetic source reports and 30 eval cases derived from them (PLAN.md section 7).
#
# Each case is authored by hand: scenario, layout, values that matter, and the expected
# outcome. The generator also computes the outcome with its own reference implementation of
# the decision table and refuses to write anything if the two disagree, so a typo here or a
# bug there is caught before the data is used.
#
# values: explicit printed values ("11.3") or a class
#         (normal | mild_low | mild_high | low | high | critical_low | critical_high).
#         Tests not listed are sampled as normal; derived tests are calculated.
# allow_abnormal: derived or related tests that may legitimately come out abnormal.
# expect.next_step / urgency / package / rule follow PLAN.md section 4.
#
# Sources (split: source, D01-D15): clean digital PDFs, 3 per panel. Used for development
#   and tuning only; never scored in the reported numbers.
# Eval cases (split: eval, E01-E30): frozen before tuning and scored. Each names its
#   `source`, a `variation` group and the `change` applied. The generator starts from a deep
#   copy of the source spec and applies the case's fields on top: values, names, units,
#   printed_flags and extra_rows are merged key by key (a null value removes an inherited
#   key); every other field replaces the source's. `expect` is never inherited and is written by hand for every case.
#   Groups: controlled_variation (10), perturbation (8), extraction_challenge (6),
#   adversarial (6). The generator refuses to write data if a controlled variation leaves the
#   outcome unchanged, or if any eval case duplicates its source or another case.

